<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA 2K27 - La Pomada Team Generator V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0c;
            --panel-bg: #15151a;
            --neon-blue: #00d2ff;
            --neon-red: #ff0055;
            --neon-orange: #ffaa00;
            --text-main: #f0f0f0;
            --text-muted: #888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Roboto', sans-serif;
            background-image: 
                linear-gradient(rgba(10, 10, 12, 0.9), rgba(10, 10, 12, 0.9)),
                url('data:image/svg+xml;utf8,<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M0 0h40v40H0V0zm20 20h20v20H20V20zM0 20h20v20H0V20z" fill="%231a1a24" fill-opacity="0.4" fill-rule="evenodd"/></svg>');
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1, h2, h3 {
            font-family: 'Teko', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 3.5rem;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            margin-bottom: 20px;
            font-style: italic;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        @media (max-width: 900px) {
            .layout-grid { grid-template-columns: 1fr; }
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid #2a2a35;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .panel h2 {
            font-size: 2rem;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-create h2 { color: var(--neon-orange); }
        .panel-active h2 { color: var(--neon-blue); }
        .panel-inactive h2 { color: var(--text-muted); }

        /* Formulario */
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #444;
            color: #fff;
            font-family: 'Roboto', sans-serif;
            border-radius: 4px;
            margin-bottom: 15px;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--neon-orange); }

        .positions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: #222;
            padding: 10px;
            border-radius: 4px;
            transition: 0.2s;
        }
        .checkbox-label:hover { background: #333; }

        .btn {
            width: 100%;
            padding: 15px;
            font-family: 'Teko', sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-add {
            background: #222;
            color: var(--neon-orange);
            border: 1px solid var(--neon-orange);
        }
        .btn-add:hover {
            background: var(--neon-orange);
            color: #000;
            box-shadow: 0 0 15px var(--neon-orange);
        }
        
        .btn-cancel {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--text-muted);
            margin-top: 10px;
            display: none; /* Se muestra al editar */
        }
        .btn-cancel:hover { background: #333; color: #fff; }

        .btn-generate {
            background: var(--neon-red);
            color: #fff;
            margin-top: 30px;
            width: 100%;
            max-width: 1200px;
            font-size: 2rem;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }
        .btn-generate:hover {
            background: #ff3377;
            box-shadow: 0 0 25px var(--neon-red);
            transform: translateY(-2px);
        }

        /* Listas de jugadores */
        .player-list {
            list-style: none;
            flex-grow: 1;
            overflow-y: auto;
            max-height: 500px;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 4px;
            border-left: 4px solid #444;
        }

        .panel-active .player-item { border-left-color: var(--neon-blue); background: #1a222c; }
        .panel-inactive .player-item { opacity: 0.7; }

        .player-info {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .player-name { font-weight: bold; font-size: 1.1rem; }
        .panel-active .player-pos { color: var(--neon-blue); font-size: 0.8rem; }
        .panel-inactive .player-pos { color: var(--text-muted); font-size: 0.8rem; }

        .player-actions {
            display: flex;
            gap: 5px;
        }

        .player-actions button {
            background: #333;
            border: none;
            border-radius: 4px;
            padding: 5px 8px;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
        }
        .player-actions button:hover { background: #555; }
        .btn-move { font-size: 1.2rem; }

        .status-count { font-size: 1.5rem; }
        .status-count.ready { color: var(--neon-blue); text-shadow: 0 0 5px var(--neon-blue); }
        .status-count.error-count { color: var(--neon-red); }

        #errorMsg {
            color: var(--neon-red);
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            font-size: 1.2rem;
            min-height: 24px;
        }

        /* Resultados */
        .results-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            margin-top: 20px;
            display: none;
        }

        .team-panel {
            flex: 1;
            min-width: 300px;
            background: #111;
            border-radius: 8px;
            padding: 20px;
        }

        .team-1 { border: 2px solid var(--neon-blue); box-shadow: 0 0 20px rgba(0, 210, 255, 0.2); }
        .team-2 { border: 2px solid var(--neon-red); box-shadow: 0 0 20px rgba(255, 0, 85, 0.2); }

        .team-panel h3 {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 20px;
            font-style: italic;
        }
        .team-1 h3 { color: var(--neon-blue); }
        .team-2 h3 { color: var(--neon-red); }

        .lineup-slot {
            display: flex;
            align-items: center;
            background: #1a1a1a;
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 4px;
        }

        .slot-pos {
            font-family: 'Teko', sans-serif;
            font-size: 1.5rem;
            width: 120px;
        }
        .team-1 .slot-pos { color: var(--neon-blue); }
        .team-2 .slot-pos { color: var(--neon-red); }

        .slot-name {
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>NBA 2K27 LA POMADA TEAM DRAFTER</h1>

    <div class="layout-grid">
        <!-- Panel Creación/Edición -->
        <div class="panel panel-create">
            <h2 id="formTitle">Fichar Jugador</h2>
            <input type="hidden" id="editPlayerId" value="">
            <input type="text" id="playerName" placeholder="Nombre (Ej: Colega 1)" autocomplete="off">
            <div class="positions-grid">
                <label class="checkbox-label"><input type="checkbox" value="Base" class="pos-check"> Base</label>
                <label class="checkbox-label"><input type="checkbox" value="Lock" class="pos-check"> Lock</label>
                <label class="checkbox-label"><input type="checkbox" value="Alero/Escolta" class="pos-check"> Alero/Escolta</label>
                <label class="checkbox-label"><input type="checkbox" value="Ala Pivot" class="pos-check"> Ala Pívot</label>
                <label class="checkbox-label"><input type="checkbox" value="Pivot" class="pos-check"> Pívot</label>
            </div>
            <button class="btn btn-add" id="btnSave" onclick="savePlayer()">AÑADIR A LA POOL</button>
            <button class="btn btn-cancel" id="btnCancel" onclick="cancelEdit()">CANCELAR EDICIÓN</button>
        </div>

        <!-- Panel Activos -->
        <div class="panel panel-active">
            <h2>
                ACTIVOS
                <span id="activeCount" class="status-count">0/10</span>
            </h2>
            <ul id="activeList" class="player-list"></ul>
        </div>

        <!-- Panel Inactivos -->
        <div class="panel panel-inactive">
            <h2>BANQUILLO</h2>
            <ul id="inactiveList" class="player-list"></ul>
        </div>
    </div>

    <button class="btn btn-generate" onclick="generateTeams()">SIMULAR EQUIPOS</button>
    <p id="errorMsg"></p>

    <div class="results-container" id="resultsContainer">
        <div class="team-panel team-1">
            <h3>EQUIPO 1</h3>
            <div id="lineup1"></div>
        </div>
        <div class="team-panel team-2">
            <h3>EQUIPO 2</h3>
            <div id="lineup2"></div>
        </div>
    </div>

    <script>
        let players = JSON.parse(localStorage.getItem('nba2k26_players_v2')) || [];
        const requiredPositions = ["Base", "Lock", "Alero/Escolta", "Ala Pivot", "Pivot"];

        // Elementos DOM del formulario
        const playerNameInput = document.getElementById('playerName');
        const posCheckboxes = document.querySelectorAll('.pos-check');
        const editPlayerIdInput = document.getElementById('editPlayerId');
        const btnSave = document.getElementById('btnSave');
        const btnCancel = document.getElementById('btnCancel');
        const formTitle = document.getElementById('formTitle');
        const errorMsg = document.getElementById('errorMsg');
        
        // Elementos DOM de las listas
        const activeList = document.getElementById('activeList');
        const inactiveList = document.getElementById('inactiveList');
        const activeCountDisplay = document.getElementById('activeCount');
        const resultsContainer = document.getElementById('resultsContainer');

        function syncStorage() {
            localStorage.setItem('nba2k26_players_v2', JSON.stringify(players));
            renderLists();
        }

        function savePlayer() {
            const name = playerNameInput.value.trim();
            const selectedPos = Array.from(posCheckboxes).filter(cb => cb.checked).map(cb => cb.value);
            const editId = editPlayerIdInput.value;

            if (!name) return showError("Introduce un nombre.");
            if (selectedPos.length === 0) return showError("Selecciona al menos una posición.");

            if (editId) {
                // Actualizar jugador existente
                const playerIndex = players.findIndex(p => p.id === editId);
                if (playerIndex > -1) {
                    players[playerIndex].name = name;
                    players[playerIndex].positions = selectedPos;
                }
                cancelEdit(); // Limpia el formulario y vuelve al modo "Añadir"
            } else {
                // Crear nuevo
                players.push({
                    id: Date.now().toString(),
                    name: name,
                    positions: selectedPos,
                    active: false // Los nuevos van al banquillo por defecto
                });
                resetForm();
            }
            
            showError("");
            syncStorage();
        }

        function editPlayer(id) {
            const player = players.find(p => p.id === id);
            if (!player) return;

            // Rellenar formulario
            playerNameInput.value = player.name;
            editPlayerIdInput.value = player.id;
            
            posCheckboxes.forEach(cb => {
                cb.checked = player.positions.includes(cb.value);
            });

            // Cambiar interfaz del formulario
            formTitle.innerText = "Editar Jugador";
            btnSave.innerText = "GUARDAR CAMBIOS";
            btnCancel.style.display = "block";
            
            // Hacer scroll hacia arriba si está en móvil
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            resetForm();
            formTitle.innerText = "Fichar Jugador";
            btnSave.innerText = "AÑADIR A LA POOL";
            btnCancel.style.display = "none";
            editPlayerIdInput.value = "";
        }

        function resetForm() {
            playerNameInput.value = '';
            posCheckboxes.forEach(cb => cb.checked = false);
        }

        function deletePlayer(id) {
            if(confirm("¿Seguro que quieres borrar a este jugador?")) {
                players = players.filter(p => p.id !== id);
                if(editPlayerIdInput.value === id) cancelEdit();
                syncStorage();
            }
        }

        function toggleActive(id) {
            const player = players.find(p => p.id === id);
            if(player) {
                player.active = !player.active;
                syncStorage();
            }
        }

        function renderLists() {
            activeList.innerHTML = '';
            inactiveList.innerHTML = '';
            let activeCount = 0;

            players.forEach(p => {
                const li = document.createElement('li');
                li.className = 'player-item';
                
                const btnMoveText = p.active ? '⬇️ Al Banquillo' : '⬆️ A Jugar';
                
                li.innerHTML = `
                    <div class="player-info">
                        <span class="player-name">${p.name}</span>
                        <span class="player-pos">${p.positions.join(' | ')}</span>
                    </div>
                    <div class="player-actions">
                        <button onclick="toggleActive('${p.id}')" title="Mover">${btnMoveText}</button>
                        <button onclick="editPlayer('${p.id}')" title="Editar">✏️</button>
                        <button onclick="deletePlayer('${p.id}')" title="Eliminar">🗑️</button>
                    </div>
                `;

                if (p.active) {
                    activeList.appendChild(li);
                    activeCount++;
                } else {
                    inactiveList.appendChild(li);
                }
            });

            activeCountDisplay.innerText = `${activeCount}/10`;
            activeCountDisplay.className = `status-count ${activeCount === 10 ? 'ready' : 'error-count'}`;
        }

        function showError(msg) { errorMsg.innerText = msg; }

        function generateTeams() {
            const activePlayers = players.filter(p => p.active);
            resultsContainer.style.display = 'none';

            if (activePlayers.length !== 10) {
                return showError(`Necesitas 10 activos. Ahora hay ${activePlayers.length}. Mueve jugadores entre paneles.`);
            }

            const slots = [];
            requiredPositions.forEach(pos => {
                slots.push({ team: 1, pos: pos });
                slots.push({ team: 2, pos: pos });
            });

            let finalAssignment = null;

            function solve(slotIndex, available, currentAssigment) {
                if (slotIndex === 10) {
                    finalAssignment = [...currentAssigment];
                    return true;
                }
                const currentSlot = slots[slotIndex];
                let shuffledAvailable = [...available].sort(() => Math.random() - 0.5);

                for (let i = 0; i < shuffledAvailable.length; i++) {
                    const candidate = shuffledAvailable[i];
                    if (candidate.positions.includes(currentSlot.pos)) {
                        currentAssigment.push({ player: candidate, team: currentSlot.team, pos: currentSlot.pos });
                        const nextAvailable = shuffledAvailable.filter(p => p.id !== candidate.id);
                        if (solve(slotIndex + 1, nextAvailable, currentAssigment)) return true;
                        currentAssigment.pop();
                    }
                }
                return false;
            }

            if (solve(0, activePlayers, [])) {
                showError("");
                renderResults(finalAssignment);
            } else {
                showError("❌ Imposible formar equipos. Revisa que las posiciones de los 10 jugadores cubran todas las necesidades.");
            }
        }

        function renderResults(assignment) {
            const lineup1 = document.getElementById('lineup1');
            const lineup2 = document.getElementById('lineup2');
            lineup1.innerHTML = ''; lineup2.innerHTML = '';

            const sortOrder = { "Base": 1, "Lock": 2, "Alero/Escolta": 3, "Ala Pivot": 4, "Pivot": 5 };
            
            [1, 2].forEach(teamNum => {
                const team = assignment.filter(a => a.team === teamNum).sort((a,b) => sortOrder[a.pos] - sortOrder[b.pos]);
                const targetDiv = teamNum === 1 ? lineup1 : lineup2;
                
                team.forEach(slot => {
                    targetDiv.innerHTML += `
                        <div class="lineup-slot">
                            <span class="slot-pos">${slot.pos}</span>
                            <span class="slot-name">${slot.player.name}</span>
                        </div>
                    `;
                });
            });

            resultsContainer.style.display = 'flex';
            resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Init
        renderLists();
    </script>
</body>
</html>
